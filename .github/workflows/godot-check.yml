name: Godot 4.3 project check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  import-and-smoke-test:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Run gameplay rules tests
        run: godot --headless --path . --script res://tests/rules_smoke.gd

      - name: Run project smoke test
        run: godot --headless --path . --quit-after 5
